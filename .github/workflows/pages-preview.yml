name: v1 CI (PR)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v1-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build (PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build website
        run: npm run build
